# L7 edge for the food-delivery platform: reverse proxy to the NestJS API
# gateway. Nginx does NO application logic (JWT/RBAC/rate-limit all live in the
# gateway per architecture.md §1) — it only forwards. The gateway runs on the
# host (not yet containerized), so the upstream targets `host.docker.internal`.
#
# HTTP-only for local dev — TLS is NOT terminated here. Production TLS is handled
# at the ingress in the ops phase (P8: K8s Ingress + cert-manager), which is where
# real certificates belong; a self-signed cert in local compose buys nothing.

upstream api_gateway {
    server host.docker.internal:3000;
}

# Shared proxy headers (identity/correlation are still verified/added by the gateway).
map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $correlation_id;
    }
}
