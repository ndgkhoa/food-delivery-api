# L7 edge for the food-delivery platform: TLS termination + reverse proxy to the
# NestJS API gateway. Nginx does NO application logic (JWT/RBAC/rate-limit all
# live in the gateway per architecture.md §1) — it only terminates TLS and
# forwards. The gateway runs on the host (not yet containerized), so upstream
# targets `host.docker.internal`.
#
# ── Local TLS certificates (self-signed) ──────────────────────────────────────
# Expected at ./infra/nginx/certs/{dev.crt,dev.key} (git-ignored). The compose
# `nginx-certs` one-shot auto-generates a self-signed pair on first `up`, so no
# manual step is needed. For a locally-TRUSTED cert (no browser warning), delete
# the generated pair and recreate it with mkcert:
#     mkcert -install
#     mkcert -cert-file infra/nginx/certs/dev.crt \
#            -key-file  infra/nginx/certs/dev.key localhost 127.0.0.1
#
# ── HTTP fallback ─────────────────────────────────────────────────────────────
# Don't want TLS locally? The plain :80 server below already proxies straight to
# the gateway, so `http://localhost` works with no certs. In that case comment
# out the entire `listen 443 ssl` block so Nginx doesn't fail on missing certs.

upstream api_gateway {
    server host.docker.internal:3000;
}

# Shared proxy headers (identity/correlation are still verified/added by the gateway).
map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $correlation_id;
    }
}

# TLS (primary). Requires the certs described above; comment out for HTTP-only dev.
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $correlation_id;
    }
}
