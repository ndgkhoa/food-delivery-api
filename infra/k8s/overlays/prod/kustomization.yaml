namespace: food-delivery
resources:
  - ../../base
  - allow-external-infra-egress.yaml

images:
  - name: food-delivery-api
    newName: ghcr.io/ndgkhoa/food-delivery-api
    newTag: set-by-cd-pipeline-at-deploy

patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=food-delivery
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
  - target:
      kind: HorizontalPodAutoscaler
      labelSelector: app.kubernetes.io/part-of=food-delivery
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target:
      kind: ConfigMap
      labelSelector: food-delivery.io/config-kind=app-env
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: placeholder
      data:
        NODE_ENV: "production"
        DB_HOST: "prod-postgres.internal.example.com"
        REDIS_URL: "redis://prod-redis.internal.example.com:6379"
        KAFKA_BROKERS: "prod-kafka.internal.example.com:9092"
        ELASTICSEARCH_NODE: "https://prod-elasticsearch.internal.example.com:9200"
        CLICKHOUSE_URL: "https://prod-clickhouse.internal.example.com:8123"
        TEMPORAL_ADDRESS: "prod-temporal.internal.example.com:7233"
        MINIO_ENDPOINT: "prod-minio.internal.example.com"
        KEYCLOAK_URL: "https://auth.example.com"
        SMTP_HOST: "prod-smtp.internal.example.com"
        # OTEL endpoint now lives in the base (otel-collector.observability:4318),
        # matching where the collector actually runs + the NetworkPolicy OTLP
        # egress carve-out — no prod-specific patch needed.
