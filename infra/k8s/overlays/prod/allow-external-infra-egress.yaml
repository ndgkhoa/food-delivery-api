apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-infra-egress
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: allow-external-infra-egress
    app.kubernetes.io/part-of: food-delivery
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 9092 }
        - { protocol: TCP, port: 7233 }
        - { protocol: TCP, port: 9200 }
        - { protocol: TCP, port: 8123 }
        - { protocol: TCP, port: 9000 }
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 587 }
        - { protocol: TCP, port: 465 }
        - { protocol: TCP, port: 25 }
