apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: food-delivery
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
