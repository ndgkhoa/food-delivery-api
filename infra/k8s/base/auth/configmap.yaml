apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: food-delivery
    food-delivery.io/config-kind: app-env
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.food-delivery:4318"
  TELEMETRY_ENABLED: "true"
  PORT: "3002"
  DB_HOST: "postgres.food-delivery"
  DB_PORT: "5432"
  DB_NAME: "auth"
  KEYCLOAK_URL: "http://keycloak.food-delivery:8080"
  KEYCLOAK_REALM: "food-delivery"
