apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: food-delivery
    food-delivery.io/config-kind: app-env
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.food-delivery:4318"
  TELEMETRY_ENABLED: "true"
  PORT: "3012"
  DB_HOST: "postgres.food-delivery"
  DB_PORT: "5432"
  DB_NAME: "notification"
  KAFKA_BROKERS: "kafka.food-delivery:9092"
  KAFKA_CLIENT_ID: "notification"
  REDIS_URL: "redis://redis.food-delivery:6379"
  SMTP_HOST: "mailpit.food-delivery"
  SMTP_PORT: "1025"
  MAIL_FROM: "notifications@food-delivery.test"
  NOTIFY_MAX_ATTEMPTS: "5"
  NOTIFY_BACKOFF_MS: "2000"
  NOTIFY_EMAIL_ENABLED: "true"
  NOTIFY_SMS_ENABLED: "true"
  NOTIFY_PUSH_ENABLED: "true"
