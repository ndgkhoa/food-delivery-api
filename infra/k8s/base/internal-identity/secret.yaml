# DEV/PLACEHOLDER value only — never a real secret. A real deployment injects
# this Secret's data from an external secret manager at deploy time; it is
# never hand-edited with production values and committed to git.
#
# LOUD NOTE: this ONE key must be byte-identical across the gateway AND every
# service (it is the shared HMAC secret the gateway signs the trusted
# identity headers with and every service verifies them against). If even one
# Deployment ends up with a different value — a stale rollout, a copy-paste
# into a per-service secret instead of this shared one — every request that
# pod handles gets a signature mismatch and 401s. There is exactly ONE Secret
# object for this key (not one per service) specifically to make that
# impossible to get out of sync within a single cluster.
apiVersion: v1
kind: Secret
metadata:
  name: internal-identity-secret
  namespace: food-delivery
  labels:
    app.kubernetes.io/part-of: food-delivery
type: Opaque
data:
  INTERNAL_IDENTITY_SIGNING_KEY: Y2hhbmdlbWUtZGV2LW9ubHktaW50ZXJuYWwtaWRlbnRpdHktc2lnbmluZy1rZXk=
