# Autoscaling for order — the ONE HPA that owns this Deployment's replicas.
# Two metrics on a single HPA is the production pattern (k8s scales to satisfy
# the MAX of them); a second HPA object on the same Deployment is an anti-pattern
# (two controllers reconcile independently and flap). `order` carries both the
# CPU signal (metrics-server) AND the custom request-rate signal fed by
# prometheus-adapter — so it doubles as the custom-metric demo without a second,
# fighting HPA. minReplicas stays 1 in the dev-shaped base; the prod overlay
# patches minReplicas up so a rolling update or node loss never drops to zero.
#
# The `http_requests_per_second` Pods metric is only READABLE once the
# observability component (in-cluster Prometheus + prometheus-adapter) is
# deployed AND the metric carries k8s topology labels (see that component's
# prometheus-adapter configmap for the OTLP-pipeline caveat). Until then the HPA
# simply can't fetch it and scales on CPU alone — a benign "no custom metric"
# warning event, never a scaling failure.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: order
    app.kubernetes.io/part-of: food-delivery
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Per-pod request rate (prometheus-adapter's `http_requests_per_second`
    # rule). Averaged across the Deployment's pods; scales out when sustained
    # RPS/pod exceeds the target. Inert until the adapter serves it (see above).
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "20"
  behavior:
    scaleDown:
      # Wait for 2 minutes of sustained low CPU before removing a pod, and
      # remove at most half the current replicas per minute — absorbs a
      # short traffic dip without immediately shedding capacity a follow-up
      # spike would just need again (flapping).
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      # React to a spike immediately (no stabilization delay) but cap growth
      # to doubling the fleet per minute so a brief blip can't overshoot
      # maxReplicas in one step.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
