# One NetworkPolicy per gateway-proxied backend: each accepts http traffic
# ONLY from the gateway pod, on its own http port. `inventory` is
# deliberately excluded here — it is not gateway-proxied, gRPC-only, and gets
# its own order-only ingress rule in ingress-grpc.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-catalog-http
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: ingress-catalog-http
    app.kubernetes.io/part-of: food-delivery
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: catalog
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - protocol: TCP
          port: 3001
---
