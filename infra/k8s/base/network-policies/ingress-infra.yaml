apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-keycloak
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: ingress-keycloak
    app.kubernetes.io/part-of: food-delivery
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: delivery
      ports:
        - protocol: TCP
          port: 8080
