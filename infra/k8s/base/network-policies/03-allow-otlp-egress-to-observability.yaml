# The OpenTelemetry collector runs in the `observability` namespace, so pushing
# traces/metrics/logs to it is the one legitimate egress OUT of food-delivery
# (besides DNS). This narrow carve-out permits every app pod to reach the
# collector's OTLP ports there; without it, a default-deny egress under a real
# CNI would silently drop all telemetry in prod (where the endpoint resolves to
# otel-collector.observability). Kept scoped to the OTLP ports so it is a
# carve-out, not a hole in the namespace boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otlp-egress-to-observability
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: allow-otlp-egress-to-observability
    app.kubernetes.io/part-of: food-delivery
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 4317
