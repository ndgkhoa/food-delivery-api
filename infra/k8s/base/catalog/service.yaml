apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: food-delivery
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: catalog
  ports:
    - name: http
      port: 3001
      targetPort: http
    - name: grpc
      port: 50051
      targetPort: grpc
