# Aggregates the namespace, all 13 per-service manifest sets, and the gateway
# Ingress into one base. Overlays (dev/prod) patch this — they never
# duplicate a manifest.
namespace: food-delivery
resources:
  - namespace.yaml
  - internal-identity
  - gateway
  - catalog
  - auth
  - order
  - search
  - delivery
  - media
  - payment
  - config
  - review
  - analytics
  - inventory
  - notification
  - ingress.yaml
  - network-policies

# Every service connects its DB/Kafka/Redis/Temporal dependencies during Nest
# bootstrap (onModuleInit/onApplicationBootstrap), which runs BEFORE the HTTP
# health port binds — so on a cold start where a dependency is slow, BOTH
# liveness and readiness would fail identically and liveness would restart the
# pod before the dependency ever appears (thundering restart + backoff). A
# startupProbe fixes that: while it runs, k8s suspends the liveness/readiness
# probes, giving each pod a generous window (30 × 10s = 5 min) to finish booting
# + connecting before liveness can ever fire. Added once here (container index 0,
# the app container) so all 13 Deployments inherit it without 13 edits.
#
# The same patch also covers graceful shutdown for every Deployment: kube-proxy
# removing a terminating pod from a Service's endpoints is asynchronous with the
# kubelet sending SIGTERM, so without a delay the process can be told to shut
# down (and Nest's onModuleDestroy hooks start draining) before traffic has
# stopped being routed to it — in-flight/new requests then hit a closing
# socket and 502. `preStop` sleeps 5s (comfortably longer than kube-proxy's
# propagation delay) so the pod is already out of rotation by the time SIGTERM
# arrives; `terminationGracePeriodSeconds: 30` gives Nest's shutdown hooks
# (Kafka consumer disconnects, Temporal worker stop, DB/Redis pool close) room
# to finish after that before the kubelet SIGKILLs the container.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet:
            path: /api/v1/health
            port: http
          periodSeconds: 10
          failureThreshold: 30
      - op: add
        path: /spec/template/spec/containers/0/lifecycle
        value:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 5"]
      - op: add
        path: /spec/template/spec/terminationGracePeriodSeconds
        value: 30
  # Wires the shared internal-identity Secret (internal-identity/secret.yaml)
  # into EVERY Deployment's container — the gateway signs the trusted identity
  # headers with this key and every service verifies them against it, so it
  # must reach all of them identically. `envFrom/-` appends regardless of how
  # many entries a given service's envFrom already has (some have only a
  # configMapRef, others already have a secretRef too), so one patch covers
  # every shape without 14 near-identical edits.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: internal-identity-secret
