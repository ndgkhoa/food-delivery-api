apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-config
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/part-of: food-delivery
    food-delivery.io/config-kind: app-env
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.food-delivery:4318"
  TELEMETRY_ENABLED: "true"
  PORT: "3010"
  CLICKHOUSE_URL: "http://clickhouse.food-delivery:8123"
  CLICKHOUSE_DATABASE: "analytics"
  KAFKA_BROKERS: "kafka.food-delivery:9092"
  KAFKA_CLIENT_ID: "analytics"
