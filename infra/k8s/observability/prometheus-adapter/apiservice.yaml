# Registers the adapter's implementation of custom.metrics.k8s.io with the
# main API server's aggregation layer — this is what makes
# `kubectl get --raw /apis/custom.metrics.k8s.io/v1beta2/...` (and the order
# HPA's metric lookups) actually route to the adapter Service.
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta2.custom.metrics.k8s.io
  labels:
    app.kubernetes.io/name: prometheus-adapter
    app.kubernetes.io/part-of: food-delivery
spec:
  group: custom.metrics.k8s.io
  version: v1beta2
  groupPriorityMinimum: 100
  versionPriority: 100
  insecureSkipTLSVerify: true
  service:
    name: prometheus-adapter
    namespace: observability
    port: 443
