# Same scrape approach as infra/prometheus/prometheus.yml (the compose
# `observability` profile): pull from the OTel Collector's Prometheus
# exporter. honor_labels: true keeps each series' own `job` label (stamped
# from the emitting service's OTel service.name) instead of every metric
# collapsing under `job=otel-collector` — prometheus-adapter's rules query
# below relies on the real per-service labels surviving the scrape.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: food-delivery
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: otel-collector
        honor_labels: true
        static_configs:
          - targets: ['otel-collector.observability.svc.cluster.local:8889']

      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
