# Identical pipeline to infra/otel-collector/config.yaml (the compose
# `observability` profile) — OTLP in, Prometheus-exporter out — so the same
# mental model applies in-cluster. Apps opt in by pointing
# OTEL_EXPORTER_OTLP_ENDPOINT at this Collector's Service (see the dev overlay
# ConfigMap patch) and setting TELEMETRY_ENABLED=true.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: food-delivery
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 128
      batch:
        timeout: 5s

    exporters:
      # Prometheus scrapes this endpoint on its own interval rather than the
      # Collector pushing to it (see the prometheus ConfigMap in this
      # directory's sibling).
      prometheus:
        endpoint: 0.0.0.0:8889

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
