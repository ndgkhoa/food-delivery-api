# DEV/PLACEHOLDER credentials only, deliberately matching the placeholder
# DB_USERNAME/DB_PASSWORD baked into every app's base/<app>/secret.yaml — so
# the representative subset (gateway+catalog) actually authenticates against
# this instance out of the box on a local k3d cluster. Never used in prod
# (the prod overlay points DB_HOST at an external managed instance instead).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: food-delivery
type: Opaque
data:
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: Y2hhbmdlbWUtZGV2LW9ubHk=
  POSTGRES_DB: Y2F0YWxvZw==
