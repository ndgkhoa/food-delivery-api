# Mirrors infra/postgres/init/01-create-service-databases.sh: creates one
# database per service so a fresh dev cluster can run migrations without a
# manual `createdb`. Mounted into /docker-entrypoint-initdb.d, which the
# official postgres image executes once, only on a brand-new data volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: food-delivery
data:
  01-create-service-databases.sh: |
    #!/bin/bash
    set -euo pipefail
    for db in catalog auth inventory order payment media notification config review; do
      if ! psql -U "$POSTGRES_USER" -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1; then
        echo "creating database: $db"
        psql -U "$POSTGRES_USER" -c "CREATE DATABASE \"$db\""
      fi
    done
