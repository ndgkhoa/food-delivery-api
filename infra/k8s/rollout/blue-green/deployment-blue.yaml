# Blue-green demo for gateway — standalone from infra/k8s/base (kept out of
# the base/overlay apply set per the plan; applied on its own to demonstrate
# the mechanism). `gateway-blue` starts as the LIVE version; the cutover
# runbook lives in service.yaml alongside this file.
#
# Identical image/spec to gateway-green on purpose: this demo proves the
# selector-switch mechanic without needing a second built image. A real
# rollout bumps `image:` (a new tag) on the `-green` Deployment before
# applying it, then cuts the Service over once it's healthy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-blue
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: food-delivery
    version: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
      version: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: food-delivery
        version: blue
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: food-delivery/gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: gateway-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
