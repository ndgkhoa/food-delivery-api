apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: gateway-success-rate
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: food-delivery
spec:
  metrics:
    - name: success-rate
      interval: 30s
      count: 3
      successCondition: len(result) == 0 || result[0] >= 0.95
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus.observability:9090
          query: >-
            sum(rate(http_server_request_duration_seconds_count{job="gateway",http_response_status_code!~"5.."}[2m]))
            /
            sum(rate(http_server_request_duration_seconds_count{job="gateway"}[2m]))
