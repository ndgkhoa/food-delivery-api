# Gates the canary's `analysis` step in rollout.yaml on the same golden-signal
# HTTP metric the observability stack's SLO alerts already key off
# (http_server_request_duration_seconds_count — see infra/prometheus/alert-rules.yml's
# HighHttp5xxRate rule): a canary whose success ratio drops below 95% auto-aborts
# and rolls back instead of promoting.
#
# Prereqs for the analysis to actually EVALUATE: the observability stack
# (Prometheus at prometheus.observability:9090) must be up, the gateway's OTLP
# metrics must reach it, and there must be live traffic on the canary (run a load
# generator — e.g. the k6 script — during the rollout). Absent any of those the
# query returns NO rows, so `len(result) == 0` is treated as a PASS: a demo with
# no metrics pipeline progresses through the pauses rather than being aborted by
# a data gap. The ratio only gates once real data exists.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: gateway-success-rate
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: food-delivery
spec:
  metrics:
    - name: success-rate
      interval: 30s
      count: 3
      # No-data (empty result) passes; a real ratio must clear 0.95. failureLimit
      # 2 rides out a single transient window instead of aborting on one blip.
      successCondition: len(result) == 0 || result[0] >= 0.95
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus.observability:9090
          query: >-
            sum(rate(http_server_request_duration_seconds_count{job="gateway",http_response_status_code!~"5.."}[2m]))
            /
            sum(rate(http_server_request_duration_seconds_count{job="gateway"}[2m]))
