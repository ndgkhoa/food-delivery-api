# Routes on a distinct Host so this demo coexists with the base
# `networking.k8s.io/v1` Ingress (infra/k8s/base/ingress.yaml) on the same
# Traefik "web" entrypoint without deleting it — Traefik's default priority
# ordering favors more specific rules, so this Host() match wins for
# requests carrying that header, while everything else still falls through
# to the base Ingress's catch-all `/` rule.
#
# Verify the split locally (repeat and tally which Deployment served each
# request via `kubectl logs`, since both pods run the same image/response):
#   for i in $(seq 1 20); do
#     curl -s -H 'Host: canary.gateway.localhost' http://localhost:8080/api/v1/health >/dev/null
#   done
#   kubectl logs -n food-delivery deploy/gateway-stable --since=1m | grep -c health
#   kubectl logs -n food-delivery deploy/gateway-canary --since=1m | grep -c health
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gateway-canary
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: food-delivery
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`canary.gateway.localhost`)
      kind: Rule
      services:
        - name: gateway-weighted
          kind: TraefikService
