apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gateway-canary
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: food-delivery
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`canary.gateway.localhost`)
      kind: Rule
      services:
        - name: gateway-weighted
          kind: TraefikService
