apiVersion: v1
kind: Service
metadata:
  name: gateway-canary
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: food-delivery
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
    track: canary
  ports:
    - name: http
      port: 3000
      targetPort: http
