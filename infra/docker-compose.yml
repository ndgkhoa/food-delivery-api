# Bring up only what a slice needs (see architecture.md §6). This slice only
# needs the `core` profile: Postgres for catalog + Redis reserved for later
# caching work. Run with: docker compose -f infra/docker-compose.yml --profile core up -d
# Explicit project name so this stack never collides with other local compose
# projects (e.g. a shared `infra` stack) that default to their folder name.
name: food-delivery

services:
  postgres:
    image: postgres:18.4
    container_name: food-delivery-postgres
    profiles: [core]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-catalog}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ Docker images store data in a major-version subdirectory and
      # expect the mount at /var/lib/postgresql (NOT /var/lib/postgresql/data).
      - postgres-data:/var/lib/postgresql
      # Creates one database per service on first init (catalog/auth/inventory/order),
      # so no manual `createdb` is needed before running migrations.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-catalog}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.0-alpine
    container_name: food-delivery-redis
    profiles: [core]
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Identity provider. Enable with the `auth` profile alongside `core`:
  #   docker compose -f infra/docker-compose.yml --profile core --profile auth up -d
  # Boots with `--import-realm`, importing infra/keycloak/realm-export.json (realm
  # `food-delivery`: roles, the public SPA client with PKCE + direct grants, the
  # audience + tenant_id mappers, and two seeded test users). Admin console at
  # http://localhost:8080 (admin/admin — dev only). First boot takes ~30-60s.
  keycloak-postgres:
    image: postgres:18.4
    container_name: food-delivery-keycloak-postgres
    profiles: [auth]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${KEYCLOAK_DB_USERNAME:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: food-delivery-keycloak
    profiles: [auth]
    restart: unless-stopped
    command: ['start-dev', '--import-realm']
    environment:
      # Bootstrap admin (dev only — never use these in a real deployment).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_ENABLED: 'true'
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy

  # L7 edge: TLS termination + reverse proxy to the host-run API gateway (:3000).
  # TLS certs are self-signed local (git-ignored) — see infra/nginx/nginx.conf for
  # mkcert/openssl generation and the HTTP-only fallback. `host.docker.internal`
  # lets the container reach the gateway running on the host.
  # HTTP-only reverse proxy for local dev — no TLS here (see nginx.conf). Real TLS
  # is terminated at the ingress in the ops phase (P8), not in local compose.
  nginx:
    image: nginx:1.30-alpine
    container_name: food-delivery-nginx
    profiles: [core]
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Event backbone. Enable with the `messaging` profile alongside `core`:
  #   docker compose -f infra/docker-compose.yml --profile core --profile messaging up -d
  # Single-broker KRaft (no separate ZooKeeper) — dev/e2e only. `libs/shared/messaging`
  # bootstraps topics idempotently on service start; nothing here pre-creates topics.
  kafka:
    image: apache/kafka:4.3.1
    container_name: food-delivery-kafka
    profiles: [messaging]
    restart: unless-stopped
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      # Dual client listener: HOST (advertised as localhost) so host processes —
      # the services run via `pnpm dev` — and e2e reach the broker on the 9092
      # mapping; INTERNAL (advertised by container name) for in-network clients
      # like Kafka Connect/Debezium added in 3b.
      KAFKA_LISTENERS: 'CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9094,HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9094,HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: '-Xmx512m -Xms512m'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qg'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  keycloak-postgres-data:
