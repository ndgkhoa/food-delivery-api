# Prometheus for the `observability` compose profile (dev only). Scrapes the
# OTel Collector's Prometheus exporter (:8889) — every service's golden-signal
# (http.server.request.duration, converted to a `http_server_request_duration_*`
# histogram) and business (orders_placed_total, order_revenue_cents_total,
# saga_outcome_total, dlq_messages_total) metrics land there, labelled `job`
# by each service's OTel `service.name`. Also self-scrapes.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: otel-collector
    # The Collector's prometheus exporter already stamps each series with a
    # per-service `job` label (from OTel `service.name`). honor_labels keeps that
    # label instead of overwriting it with this scrape's own `job=otel-collector`
    # — without it every service collapses under one `job` (real name demoted to
    # `exported_job`), so per-service dashboards + 5xx/latency alert attribution
    # all read "otel-collector" instead of the culprit service.
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
