name: CD

# Post-merge only (push to develop/main, never pull_request — forks never
# get package-write or deploy access). Builds + pushes the 13 service images
# to GHCR from the ONE parameterized Dockerfile, scans each image, then
# reaches an environment-gated, health-gated deploy.
on:
  push:
    branches: [main, develop]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ndgkhoa

jobs:
  build-push:
    name: build + push (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The 13 service apps only — apps/*-e2e projects are test-only and
        # never shipped as images.
        app:
          - gateway
          - catalog
          - auth
          - order
          - search
          - delivery
          - media
          - payment
          - config
          - review
          - analytics
          - inventory
          - notification
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          build-args: |
            APP=${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  image-scan:
    name: trivy image scan (${{ matrix.app }})
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - gateway
          - catalog
          - auth
          - order
          - search
          - delivery
          - media
          - payment
          - config
          - review
          - analytics
          - inventory
          - notification
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          format: sarif
          output: trivy-image-${{ matrix.app }}.sarif

      - name: Upload image scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-${{ matrix.app }}.sarif
          category: trivy-image-${{ matrix.app }}

  deploy:
    name: deploy (production, environment-gated)
    needs: [build-push, image-scan]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      # Always runs, secret or not — this is the honest, portfolio-safe part
      # of the gate: the prod overlay must render and validate against the
      # k8s schemas on every merge, cluster or no cluster.
      - name: Render + validate prod overlay
        run: kubectl kustomize infra/k8s/overlays/prod | kubeconform -strict -ignore-missing-schemas -summary

      # `secrets` is not a valid context inside step `if:` conditionals, so
      # the presence check happens here (where `env:` CAN read secrets) and
      # is exposed as a step output for later steps to branch on.
      - name: Check for a configured cluster
        id: kubeconfig-check
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: echo "present=$([ -n "$KUBECONFIG_CONTENT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Configure kubeconfig
        if: steps.kubeconfig-check.outputs.present == 'true'
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      # Real rollout only when a cluster is wired up (KUBECONFIG environment
      # secret, protected behind the `production` Environment's
      # required-reviewer rule). The canary/blue-green resources under
      # infra/k8s/rollout are the promotion mechanism this invokes in a real
      # cluster; `rollout status` is the health gate — it fails the job (no
      # promotion) if the new pods never become ready.
      - name: Apply prod overlay
        if: steps.kubeconfig-check.outputs.present == 'true'
        run: kubectl apply -k infra/k8s/overlays/prod

      - name: Rollout health gate
        if: steps.kubeconfig-check.outputs.present == 'true'
        run: kubectl rollout status deploy --all -n food-delivery --timeout=180s

      - name: No cluster configured
        if: steps.kubeconfig-check.outputs.present != 'true'
        run: echo "No KUBECONFIG secret set — validate-only gate passed above. This is a documented portfolio state, not a broken step; wiring a real cluster's KUBECONFIG into the 'production' Environment activates the apply + rollout health gate."
