name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ndgkhoa

jobs:
  build-push:
    name: build + push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/food-delivery-api
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=food-delivery-api
          cache-to: type=gha,mode=max,scope=food-delivery-api
          provenance: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/food-delivery-api
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest SLSA provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/food-delivery-api
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify signature
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/food-delivery-api
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/cd\.yml@refs/heads/(main|develop)$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE}@${DIGEST}"

  image-scan:
    name: trivy image scan
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/food-delivery-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          limit-severities-for-sarif: true
          trivyignores: infra/docker/.trivyignore
          format: sarif
          output: trivy-image-food-delivery-api.sarif

      - name: Upload image scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-food-delivery-api.sarif
          category: trivy-image-food-delivery-api

  deploy:
    name: deploy
    needs: [build-push, image-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform + kustomize
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin kustomize

      - name: Render + validate prod overlay
        run: kubectl kustomize infra/k8s/overlays/prod | kubeconform -strict -ignore-missing-schemas -summary

      - name: Check for a configured cluster
        id: kubeconfig-check
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: echo "present=$([ -n "$KUBECONFIG_CONTENT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Configure kubeconfig
        if: steps.kubeconfig-check.outputs.present == 'true'
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Probe cluster reachability
        id: cluster-probe
        if: steps.kubeconfig-check.outputs.present == 'true'
        run: |
          if kubectl cluster-info --request-timeout=10s >/dev/null 2>&1; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "KUBECONFIG is set but the cluster is unreachable from CI — validate-only."
          fi

      - name: Pin prod images to this commit
        if: steps.cluster-probe.outputs.reachable == 'true'
        working-directory: infra/k8s/overlays/prod
        run: |
          # Match on the base image name the overlay declares (food-delivery-api),
          # rewriting it to the GHCR image at this commit's immutable sha. Every
          # Deployment shares this one base image, so a single rewrite covers
          # all 13 services.
          kustomize edit set image \
            "food-delivery-api=${REGISTRY}/${IMAGE_NAMESPACE}/food-delivery-api:${GITHUB_SHA}"

      - name: Apply prod overlay
        if: steps.cluster-probe.outputs.reachable == 'true'
        run: kubectl apply -k infra/k8s/overlays/prod

      - name: Rollout health gate
        if: steps.cluster-probe.outputs.reachable == 'true'
        run: kubectl rollout status deploy --all -n food-delivery --timeout=180s

      - name: No reachable cluster
        if: steps.cluster-probe.outputs.reachable != 'true'
        run: echo "No reachable cluster (KUBECONFIG unset, or set but unreachable from CI) — the render+validate gate above passed. This is the documented portfolio state; wiring a CI-reachable cluster's KUBECONFIG into the 'production' Environment activates the apply + rollout health gate."
